name: Build Windows

on:
  push:
    branches: [claude-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.5.1"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            tools/.godot-cache
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Run tests and export the Windows build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip > /dev/null
          tools/build.sh test

      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ReverendInsanity-windows
          path: |
            build/windows/ReverendInsanity.exe
            README.md
            CREDITS.md
          if-no-files-found: error
